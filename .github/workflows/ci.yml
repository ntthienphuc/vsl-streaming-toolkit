name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    name: Android compile and JVM contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build reference client and test transport
        working-directory: clients/android
        run: |
          chmod +x gradlew
          ./gradlew :stream-client:testDebugUnitTest :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-compile-replay-no-detector-assets
          path: |
            clients/android/stream-client/build/reports/tests/
            clients/android/app/build/outputs/apk/debug/
          if-no-files-found: warn
  video:
    name: Optional video adapter / Python 3.11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install optional capture dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgl1 libegl1 libportaudio2
          python -m pip install ".[video]"
          python -m pip check
      - name: Check capture contract and synthetic video decoding
        run: python -m unittest discover -s tests -p test_capture.py -v
  validate:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.9'
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.11'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install and build
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install ".[server,export,dev]"
          python -m build
          python -c "import glob,subprocess,sys; subprocess.check_call([sys.executable,'-m','pip','install','--force-reinstall','--no-deps',glob.glob('dist/*.whl')[0]])"
          python -m pip check
      - name: Test installed wheel and export fixture
        run: |
          python -m unittest discover -s tests -v
          vsl-stream demo --out demo_run
          vsl-stream inspect --bundle demo_run/bundle
          python tools/verify_websocket_install.py --bundle demo_run/bundle --config demo_run/server.json --frames demo_run/frames.json --batch-size 5 --out demo_run/tcp_receipt.json
          python -m pip freeze > demo_run/resolved-requirements.txt
      - name: Verify server-only environment
        run: |
          python -m venv .venv-server
          python tools/check_server_only.py --venv .venv-server --demo demo_run
      - name: Build and check server container
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          docker build -t vsl-streaming-ci .
          python tools/check_container.py --image vsl-streaming-ci --demo demo_run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            dist/
            demo_run/receipt.json
            demo_run/tcp_receipt.json
            demo_run/server_only_receipt.json
            demo_run/container_receipt.json
            demo_run/resolved-requirements.txt
          if-no-files-found: warn
